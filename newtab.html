<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mino</title>
  <link rel="icon" href="assets/icons/icon-128.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="top-bar">
      <img src="assets/logo.svg" alt="Mino" class="brand-logo" title="Mino">
      <div class="top-actions">
        <button id="auth-toggle" class="auth-toggle" title="Sign in with Google" hidden>Sign in</button>
        <button id="auth-signout" class="auth-signout" type="button" hidden>Sign out</button>
        <button id="settings-toggle" class="settings-toggle" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <header class="clock-section">
      <div id="time" class="time">00:00</div>
      <div id="greeting" class="greeting">Good morning.</div>
      <div id="date" class="date">Monday, January 1</div>
    </header>

    <section class="middle-row">
      <details class="card collapsible-card todo-card" id="todo-panel">
        <summary class="collapsible-summary"><span>Todo list</span><span class="panel-chevron" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path d="m6.5 8 3.5 4 3.5-4"/></svg></span></summary>
        <div class="collapsible-content">
          <div class="collapsible-inner">
          <div class="card-header todo-header">
          <button id="todo-prev-day" class="day-nav" title="Previous day">‹</button>
          <button id="todo-today-btn" class="todo-date-label" title="Back to today"><span id="todo-date-label">Today</span></button>
          <button id="todo-next-day" class="day-nav" title="Next day">›</button>
          <button id="todo-clear" class="todo-clear-btn" title="Clear all tasks for this day">Clear all</button>
        </div>
          <ul id="todo-list" class="todo-list"></ul>
          <form id="todo-form" class="todo-form">
              <input type="text" id="todo-input" placeholder="Add a task..." autocomplete="off" dir="auto" required>
            <button type="submit">+</button>
          </form>
          </div>
        </div>
      </details>
      <div class="center-column">
        <form id="search-form" class="search-form" role="search">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Search the web..." autocomplete="off" autofocus>
        </form>
        <section class="shortcuts-section">
          <div id="shortcuts-container" class="shortcuts-container"></div>
          <button id="add-shortcut-btn" class="add-shortcut-btn" title="Add Shortcut">+</button>
        </section>
      </div>
      <details class="card collapsible-card calendar-card" id="calendar-panel">
        <summary class="collapsible-summary"><span>Calendar</span><span class="panel-chevron" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path d="m6.5 8 3.5 4 3.5-4"/></svg></span></summary>
        <div class="collapsible-content">
          <div class="collapsible-inner">
          <div class="card-header"><span id="calendar-month-year"></span></div>
          <div id="calendar-grid" class="calendar-grid"></div>
          </div>
        </div>
      </details>
    </section>
  </main>

  <footer class="slogan">Everything essential. Nothing extra.</footer>

  <dialog id="app-dialog" class="app-dialog" aria-labelledby="app-dialog-title" aria-describedby="app-dialog-message">
    <section class="app-dialog-card">
      <button id="app-dialog-close" class="app-dialog-close" type="button" aria-label="Close">&times;</button>
      <p id="app-dialog-kicker" class="app-dialog-kicker">Mino</p>
      <h2 id="app-dialog-title">Are you sure?</h2>
      <p id="app-dialog-message"></p>
      <div class="app-dialog-actions">
        <button id="app-dialog-cancel" class="dialog-button dialog-button-secondary" type="button">Cancel</button>
        <button id="app-dialog-confirm" class="dialog-button dialog-button-primary" type="button">Confirm</button>
      </div>
    </section>
  </dialog>

  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-header">
      <span>Appearance</span>
      <button id="settings-close" class="settings-close" aria-label="Close">×</button>
    </div>
    <div class="settings-body">
      <label class="setting-row">
        <span>Theme</span>
        <span class="theme-options" id="setting-theme" role="group" aria-label="Theme">
          <button type="button" data-theme="light">Light</button>
          <button type="button" data-theme="dark">Dark</button>
        </span>
      </label>
      <label class="setting-row">
        <span>Accent color</span>
        <span class="color-options" id="accent-options"></span>
      </label>
      <label class="setting-row">
        <span>Background</span>
        <span class="gradient-options" id="gradient-options"></span>
      </label>
      <label class="setting-row setting-row-stack">
        <span>Background image URL</span>
        <input type="text" id="setting-bg-url" placeholder="https://example.com/photo.jpg">
      </label>
      <label class="setting-row">
        <span>Glass opacity</span>
        <input type="range" id="setting-glass-opacity" min="35" max="85" step="1">
      </label>
      <label class="setting-row">
        <span>Glass blur</span>
        <input type="range" id="setting-glass-blur" min="0" max="32" step="1">
      </label>
      <label class="setting-row">
        <span>Calendar</span>
        <span class="calendar-options" id="setting-calendar" role="group" aria-label="Calendar type">
          <button type="button" data-calendar="gregorian">Gregorian</button>
          <button type="button" data-calendar="persian">Persian</button>
        </span>
      </label>
      <label class="setting-row">
        <span>24-hour clock</span>
        <input type="checkbox" id="setting-clock24">
      </label>
      <label class="setting-row">
        <span>Show seconds</span>
        <input type="checkbox" id="setting-seconds">
      </label>
      <label class="setting-row">
        <span>Your name</span>
        <input type="text" id="setting-name" placeholder="e.g. Alex" maxlength="30">
      </label>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/todo.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/search.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
